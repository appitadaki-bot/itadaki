# Actualiza las dependencias solo, con un PR por semana.
#
# Sin esto, una falla publicada hoy se descubre el día que alguien corre la
# auditoría a mano — que en la práctica es el día que algo ya pasó.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Un PR por semana con todo junto: veinte PR sueltos no los revisa nadie,
    # y lo que no se revisa se mergea sin mirar.
    open-pull-requests-limit: 3

    # Los grupos llevan sólo menores y parches. Las mayores vienen sueltas.
    #
    # Agrupadas, una mayor que rompe la configuración deja el PR entero en rojo
    # y con él las diez actualizaciones sanas que venían al lado: nadie puede
    # mergear ninguna hasta que alguien arregle la que molesta, y mientras tanto
    # el PR se queda abierto. Nos pasó con eslint 10 y jest 30 arriba de ocho
    # subidas triviales.
    #
    # Sueltas, cada mayor se mira cuando corresponde y las menores entran en
    # cinco minutos.
    groups:
      produccion:
        dependency-type: production
        update-types: ['minor', 'patch']
      desarrollo:
        dependency-type: development
        update-types: ['minor', 'patch']

    # Angular no sube de mayor por acá.
    #
    # El salto a 22 entró dos veces y las dos rompió la instalación:
    # `@angular/build@22` pide `typescript >=6.0 <6.1` y el proyecto usa la 5,
    # así que `npm ci` termina en ERESOLVE y no corre ni un test. La segunda vez
    # fue peor, porque el PR reaplicó exactamente lo que otro había revertido y
    # nadie lo notó hasta ver CI en rojo.
    #
    # Actualizar Angular de mayor es una migración con su propio trabajo —
    # TypeScript, las cuatro apps, el build— y se decide, no se mergea de paso
    # con otros dieciséis paquetes.
    # TypeScript y zone.js no se mueven solos: los fija Angular.
    #
    # `@angular/build@19` acepta `typescript >=5.5 <5.9` y `zone.js ~0.15`. Una
    # subida menor alcanza para salirse de ese rango, y ahí `npm ci` termina en
    # ERESOLVE: no compila nadie, ni CI ni los cuatro despliegues. Ya pasó con
    # 5.7 → 5.9, con la regla de mayores puesta y sin frenarlo.
    #
    # Se mueven el día que se mueva Angular, en la misma migración y probando
    # las cuatro apps. Los parches siguen entrando: no cambian el rango.
    ignore:
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
      - dependency-name: 'zone.js'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'

  # Las acciones del CI también se quedan viejas, y corren con acceso al repo.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
