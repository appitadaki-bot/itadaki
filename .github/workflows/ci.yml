name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Tests
        run: npx jest --ci

      - name: Build API
        run: npm run build:api

      - name: Build apps
        run: |
          npx ng build diner-pwa
          npx ng build kds-web
          npx ng build admin-web
          npx ng build floor-web

  # Una dependencia con una falla conocida entra sin que nadie la escriba: la
  # instala otra dependencia. Se revisa en cada cambio porque el aviso llega
  # cuando la falla se publica, no cuando alguien decide mirar.
  #
  # Sólo lo que llega al servidor (`--omit=dev`): una falla en una herramienta
  # de desarrollo no la puede alcanzar nadie desde afuera, y frenar los PR por
  # eso enseña a ignorar el aviso.
  dependencies:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # Lo que corre en el servidor. Falla el build: la API no sale con una
      # falla conocida adentro.
      - name: Vulnerabilidades en producción
        run: npm audit --omit=dev --audit-level=high

      # Lo que se descarga al teléfono del comensal.
      #
      # Angular está declarado en devDependencies —es lo normal, porque el
      # build produce archivos estáticos— así que el chequeo de arriba no lo
      # mira. Sin esto, una falla de sanitización en el compilador de Angular
      # pasaba por "cero vulnerabilidades en producción" mientras viajaba en
      # cada bundle.
      #
      # No corta el build: hoy la única salida a las de Angular es una
      # migración de mayor, y bloquear cada PR por una decisión que no se toma
      # en un PR sólo enseña a saltear el chequeo. Queda a la vista en el log,
      # que es lo que hoy no pasaba.
      - name: Vulnerabilidades en todo lo demás
        continue-on-error: true
        run: npm audit --audit-level=high

  # The API has to start from `dependencies` alone. Catching this in CI is the
  # point: a runtime package left in devDependencies installs fine here and
  # fails only on the server, where the build step never runs.
  production-install:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build:api

      - name: Reinstall without dev dependencies
        run: npm ci --omit=dev

      - name: Boot the API
        env:
          USE_POSTGRES: 'false'
          PORT: '3000'
        run: |
          node dist/api/apps/api/src/main.js &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "api answered"
              exit 0
            fi
            sleep 1
          done
          echo "api never answered"
          exit 1

  # The image has to build, and the API inside it has to answer. A Dockerfile
  # that only builds is half the check: sharp's native binaries fail at the
  # first photo, not at compile time.
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t itadaki-api:ci .

      - name: Boot it
        run: |
          # The image pins NODE_ENV=production, so every guard applies: it
          # refuses to boot without a signing key, a mail provider or a CORS
          # allowlist. That is the behaviour under test — these values are
          # throwaway, and a real deploy supplies real ones.
          docker run -d --name itadaki-ci \
            -e USE_POSTGRES=false \
            -e AUTH_SECRET=solo-para-ci-no-es-un-secreto-real-000 \
            -e RESEND_API_KEY=clave-de-ci \
            -e MAIL_FROM='Itadaki <ci@ejemplo.test>' \
            -e CORS_ORIGINS=http://localhost:4200 \
            -p 3000:3000 itadaki-api:ci

          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "la api respondió"
              # sharp's native binaries fail at the first photo, not at build
              # time, so the image is only proven once this runs inside it.
              docker exec itadaki-ci node -e "require('sharp')({create:{width:8,height:8,channels:3,background:'#000'}}).webp().toBuffer().then(()=>process.exit(0)).catch(()=>process.exit(1))"
              docker rm -f itadaki-ci
              exit 0
            fi
            sleep 2
          done

          echo "la api nunca respondió"
          docker logs itadaki-ci
          exit 1
