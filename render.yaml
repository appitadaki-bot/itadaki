# Despliegue de la API en Render.
#
# Sólo la API y la base: las cuatro apps del navegador son archivos estáticos
# y viven en Vercel.
#
# El plan gratis duerme el servicio a los 15 minutos sin tráfico y tarda cerca
# de un minuto en despertar. Alcanza para probar y para mostrar demos; para un
# restaurante cobrando hay que pasar a un plan pago, porque el primer comensal
# de la noche no va a esperar ese minuto mirando una pantalla en blanco.

services:
  - type: web
    name: itadaki-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health

    envVars:
      # Firma las sesiones del personal. Render la genera una vez y la guarda;
      # si se filtra, cualquiera puede fabricarse un token de dueño.
      - key: AUTH_SECRET
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: itadaki-db
          property: connectionString

      # Los dominios que pueden llamar a esta API, separados por coma. Sin
      # esto el navegador bloquea las llamadas: la página carga y no puede
      # hacer nada, y el error que se ve dice "sin conexión" aunque la red
      # esté perfecta.
      #
      # Son CINCO, no cuatro: las cuatro apps y la landing. La landing empezó
      # siendo estática y por eso quedó afuera — ahora crea la cuenta del
      # restaurante, así que también llama a la API.
      - key: CORS_ORIGINS
        sync: false

      # Prefijo que queda guardado dentro de cada foto que se sube, así que
      # conviene definirlo antes de la primera carga.
      - key: IMAGE_BASE_URL
        sync: false

      # A dónde apunta el QR impreso. Sin esto los códigos salen apuntando a
      # localhost y no funcionan en ningún teléfono que no sea el de quien los
      # generó — el error se ve recién al escanear uno.
      - key: DINER_APP_URL
        sync: false

      # Si sentarse a una mesa exige el código que da el mozo. Apagado mientras
      # se prueba: cada prueba mandaba a buscar el código al salón antes de
      # poder pedir nada. Ponerlo en "1" antes de que haya un local de verdad
      # usando esto — sin el código, una foto del QR alcanza para entrar a la
      # mesa desde afuera.
      - key: REQUIRE_JOIN_CODE
        value: "0"

      # Sin proveedor de correo la API se niega a arrancar en producción: un
      # flujo de recuperación que no manda nada es peor que uno que falta.
      # Sin esto el guard de producción no corre y la API arranca con el
      # mailer de consola: el link de recuperación se imprime en el log del
      # servidor en vez de enviarse. Parece que funciona y nadie recibe nada.
      - key: NODE_ENV
        value: production

      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

      # A quiénes avisamos cuando alguien deja sus datos en la landing.
      # Varias direcciones separadas por coma: el alta la atiende quien esté,
      # y una sola casilla hace que un fin de semana se pierda.
      #
      # Sin esto el interesado se guarda igual, pero nadie se entera de que
      # está esperando el WhatsApp que le prometimos en la pantalla.
      - key: INTERESADOS_EMAIL
        sync: false

      # Dónde viven los bytes de las fotos. Sin las cuatro, la API cae al disco
      # del contenedor, que Render borra cada vez que el servicio se duerme o
      # se redespliega: la fila en la base queda y la imagen da 404. Sirve
      # cualquier S3 compatible — R2, B2, S3.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      # La región entra en la firma de cada pedido, así que tiene que ser
      # exactamente la que usa el proveedor. Backblaze la pone en el propio
      # endpoint —s3.us-west-004.backblazeb2.com es us-west-004— y firmar con
      # otra hace fallar toda subida con SignatureDoesNotMatch. Cloudflare R2
      # acepta "auto", que es el valor por defecto si no se declara.
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

      # Observabilidad, las tres opcionales: sin ellas la API arranca y anda
      # igual, sólo que un error no controlado se ve nada más que en el log
      # de Render (retención corta, sin buscador ni alertas).
      - key: SENTRY_DSN
        sync: false
      - key: AXIOM_TOKEN
        sync: false
      - key: AXIOM_DATASET
        sync: false

databases:
  - name: itadaki-db
    plan: free
    region: oregon
    # El plan gratis de Render borra la base a los 90 días. Antes de eso hay
    # que pasar a un plan pago o migrarla — scripts/backup.sh saca el dump.
    postgresMajorVersion: "16"

# ─────────────────────────────────────────────────────────────────────────────
# El aviso de vencimiento, cuando haga falta prenderlo.
#
# El correo que avisa que la suscripción venció sale de un proceso que hay que
# correr todos los días. Está escrito y probado, pero sin cron: un cron job en
# Render se cobra por minuto corrido, y sin restaurantes que puedan vencer
# estaría pagando por leer una tabla vacía. Hasta entonces se corre a mano:
#
#     DATABASE_ADMIN_URL=... npm run avisos:vencimiento -- --secos
#
# `--secos` dice a quién le tocaría sin mandar nada. Sacarlo lo manda.
#
# Cuando el primer local esté pagando, se crea el cron desde el panel de
# Render — New → Cron Job — con estos valores:
#
#     Name                 itadaki-avisos-vencimiento
#     Language             Docker
#     Branch               main
#     Region               oregon (la misma que la base)
#     Root Directory       (vacío)
#     Schedule             0 11 * * *      11 UTC = 8 de la mañana acá
#     Compute              el más chico: 0.5 CPU, 512 MB
#     Dockerfile Path      ./Dockerfile
#     Docker Command       node dist/api/apps/api/src/avisar-vencimientos.js
#
# El Docker Command es el campo que importa. Vacío, Render usa el CMD del
# Dockerfile y levanta la API entera: un proceso que no termina nunca, en un
# servicio que se cobra por minuto, y ningún correo enviado.
#
# Y NO `npm run avisos:vencimiento`, que es lo que se corre en una máquina de
# desarrollo: ese script compila primero, y la imagen de runtime se instala
# con `npm ci --omit=dev`, sin TypeScript.
#
# Variables: DATABASE_ADMIN_URL (la Internal Database URL de itadaki-db),
# RESEND_API_KEY y MAIL_FROM (las mismas que itadaki-api). NODE_ENV ya viene
# en production desde el Dockerfile.
#
# A propósito no está declarado acá abajo como servicio: si este archivo está
# sincronizado como Blueprint, agregarlo lo crearía solo, que es justamente lo
# que no se quiere todavía.
